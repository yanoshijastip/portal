<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yanoshi Jastip - Portal Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Animasi Modal */
        .modal {
            transition: opacity 0.25s ease;
        }
        body.modal-active {
            overflow-y: hidden;
        }
        
        /* Glassmorphism Card Hover */
        .dashboard-card {
            transition: all 0.3s cubic-bezier(.25,.8,.25,1);
        }
        .dashboard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.1);
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="bg-gray-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-40 border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex-shrink-0 flex items-center gap-3">
                    <img class="h-10 w-auto object-contain" src="https://yanoshijapan.github.io/asetonline/jastiplogo.png" alt="Yanoshi Logo">
                </div>
                <div>
                    <a href="https://jastipyanoshi.netlify.app/" target="_blank" class="inline-flex items-center justify-center px-5 py-2 border border-transparent text-sm font-medium rounded-full text-white bg-slate-900 hover:bg-slate-800 transition shadow-lg hover:shadow-xl ring-offset-2 focus:ring-2 ring-slate-900">
                        Buka Website <i class="fa-solid fa-arrow-up-right-from-square ml-2"></i>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
        
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold text-slate-900 mb-2">Selamat Datang</h1>
            <p class="text-slate-500">Pilih menu untuk memulai.</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            
            <button onclick="openModal('modal-cekbarang')" class="dashboard-card bg-white p-6 rounded-2xl border border-gray-100 shadow-sm flex flex-col items-center text-center group cursor-pointer h-full">
                <div class="w-14 h-14 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center text-2xl mb-4 group-hover:bg-blue-600 group-hover:text-white transition-colors">
                    <i class="fa-solid fa-box-open"></i>
                </div>
                <h3 class="font-bold text-lg text-slate-800">Cek Barang</h3>
                <p class="text-sm text-slate-400 mt-2">Cek barang Indo & Jepang</p>
            </button>

            <button onclick="openModal('modal-invoice')" class="dashboard-card bg-white p-6 rounded-2xl border border-gray-100 shadow-sm flex flex-col items-center text-center group cursor-pointer h-full">
                <div class="w-14 h-14 bg-green-50 text-green-600 rounded-full flex items-center justify-center text-2xl mb-4 group-hover:bg-green-600 group-hover:text-white transition-colors">
                    <i class="fa-solid fa-file-invoice-dollar"></i>
                </div>
                <h3 class="font-bold text-lg text-slate-800">Invoice & Bayar</h3>
                <p class="text-sm text-slate-400 mt-2">Cek pembayaran & kirim tagihan</p>
            </button>

            <button onclick="openModal('modal-belanja')" class="dashboard-card bg-white p-6 rounded-2xl border border-gray-100 shadow-sm flex flex-col items-center text-center group cursor-pointer h-full">
                <div class="w-14 h-14 bg-purple-50 text-purple-600 rounded-full flex items-center justify-center text-2xl mb-4 group-hover:bg-purple-600 group-hover:text-white transition-colors">
                    <i class="fa-solid fa-cart-shopping"></i>
                </div>
                <h3 class="font-bold text-lg text-slate-800">Belanja</h3>
                <p class="text-sm text-slate-400 mt-2">Input link & checkout</p>
            </button>

            <button onclick="openModal('modal-spreadsheet')" class="dashboard-card bg-white p-6 rounded-2xl border border-gray-100 shadow-sm flex flex-col items-center text-center group cursor-pointer h-full">
                <div class="w-14 h-14 bg-orange-50 text-orange-600 rounded-full flex items-center justify-center text-2xl mb-4 group-hover:bg-orange-600 group-hover:text-white transition-colors">
                    <i class="fa-solid fa-table-list"></i>
                </div>
                <h3 class="font-bold text-lg text-slate-800">Database</h3>
                <p class="text-sm text-slate-400 mt-2">Akses Spreadsheet Utama</p>
            </button>

        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 mt-auto">
        <div class="max-w-7xl mx-auto py-6 px-4 text-center">
            <p class="text-slate-400 text-sm">&copy; 2026 Yanoshi Jastip. All rights reserved.</p>
        </div>
    </footer>

    <div id="modal-cekbarang" class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50">
        <div class="modal-overlay absolute w-full h-full bg-slate-900 opacity-50 backdrop-blur-sm" onclick="closeModal('modal-cekbarang')"></div>
        <div class="modal-container bg-white w-11/12 md:max-w-md mx-auto rounded-2xl shadow-2xl z-50 overflow-y-auto transform scale-95 transition-transform duration-300">
            <div class="modal-content py-6 text-left px-6">
                <div class="flex justify-between items-center pb-3">
                    <p class="text-2xl font-bold text-slate-800">Cek Barang</p>
                    <div class="modal-close cursor-pointer z-50 text-slate-400 hover:text-slate-800" onclick="closeModal('modal-cekbarang')">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </div>
                </div>
                <div class="flex flex-col gap-3">
                    <a href="https://yanoshijapan.github.io/cekindojepang/" target="_blank" class="w-full bg-blue-50 hover:bg-blue-600 hover:text-white text-blue-700 font-semibold py-3 px-4 rounded-xl transition duration-300 flex items-center justify-between group">
                        <span>Cek Barang Indo - Jepang</span>
                        <i class="fa-solid fa-plane-departure group-hover:translate-x-1 transition-transform"></i>
                    </a>
                    <a href="https://yanoshijapan.github.io/inputjepangindo/" target="_blank" class="w-full bg-blue-50 hover:bg-blue-600 hover:text-white text-blue-700 font-semibold py-3 px-4 rounded-xl transition duration-300 flex items-center justify-between group">
                        <span>Cek Barang Jepang - Indo</span>
                        <i class="fa-solid fa-plane-arrival group-hover:translate-x-1 transition-transform"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-invoice" class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50">
        <div class="modal-overlay absolute w-full h-full bg-slate-900 opacity-50 backdrop-blur-sm" onclick="closeModal('modal-invoice')"></div>
        <div class="modal-container bg-white w-11/12 md:max-w-md mx-auto rounded-2xl shadow-2xl z-50 overflow-y-auto transform scale-95 transition-transform duration-300">
            <div class="modal-content py-6 text-left px-6">
                <div class="flex justify-between items-center pb-3">
                    <p class="text-2xl font-bold text-slate-800">Keuangan</p>
                    <div class="modal-close cursor-pointer z-50 text-slate-400 hover:text-slate-800" onclick="closeModal('modal-invoice')">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </div>
                </div>
                <div class="flex flex-col gap-3 mt-4">
                    <a href="https://yanoshijapan.github.io/cekbayarjastip/" target="_blank" class="w-full bg-green-50 hover:bg-green-600 hover:text-white text-green-700 font-semibold py-3 px-4 rounded-xl transition duration-300 flex items-center justify-between group">
                        <span>Cek Pembayaran</span>
                        <i class="fa-solid fa-magnifying-glass-dollar group-hover:translate-x-1 transition-transform"></i>
                    </a>
                    <a href="https://yanoshijapan.github.io/kiriminvoice/" target="_blank" class="w-full bg-green-50 hover:bg-green-600 hover:text-white text-green-700 font-semibold py-3 px-4 rounded-xl transition duration-300 flex items-center justify-between group">
                        <span>Kirim Invoice</span>
                        <i class="fa-solid fa-paper-plane group-hover:translate-x-1 transition-transform"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-belanja" class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50">
        <div class="modal-overlay absolute w-full h-full bg-slate-900 opacity-50 backdrop-blur-sm" onclick="closeModal('modal-belanja')"></div>
        <div class="modal-container bg-white w-11/12 md:max-w-md mx-auto rounded-2xl shadow-2xl z-50 overflow-y-auto transform scale-95 transition-transform duration-300">
            <div class="modal-content py-6 text-left px-6">
                <div class="flex justify-between items-center pb-3">
                    <p class="text-2xl font-bold text-slate-800">Belanja</p>
                    <div class="modal-close cursor-pointer z-50 text-slate-400 hover:text-slate-800" onclick="closeModal('modal-belanja')">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </div>
                </div>
                <div class="flex flex-col gap-3 mt-4">
                    <a href="https://yanoshijapan.github.io/linkbelanja/" target="_blank" class="w-full bg-purple-50 hover:bg-purple-600 hover:text-white text-purple-700 font-semibold py-3 px-4 rounded-xl transition duration-300 flex items-center justify-between group">
                        <span>Belanja & Input Link</span>
                        <i class="fa-solid fa-link group-hover:translate-x-1 transition-transform"></i>
                    </a>
                    <a href="https://yanoshijapan.github.io/checkoutjastip/" target="_blank" class="w-full bg-purple-50 hover:bg-purple-600 hover:text-white text-purple-700 font-semibold py-3 px-4 rounded-xl transition duration-300 flex items-center justify-between group">
                        <span>Checkout Link</span>
                        <i class="fa-solid fa-bag-shopping group-hover:translate-x-1 transition-transform"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-spreadsheet" class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50">
        <div class="modal-overlay absolute w-full h-full bg-slate-900 opacity-50 backdrop-blur-sm" onclick="closeModal('modal-spreadsheet')"></div>
        <div class="modal-container bg-white w-11/12 md:max-w-md mx-auto rounded-2xl shadow-2xl z-50 overflow-y-auto transform scale-95 transition-transform duration-300">
            <div class="modal-content py-6 text-left px-6">
                <div class="flex justify-between items-center pb-3">
                    <p class="text-2xl font-bold text-slate-800">Spreadsheet</p>
                    <div class="modal-close cursor-pointer z-50 text-slate-400 hover:text-slate-800" onclick="closeModal('modal-spreadsheet')">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </div>
                </div>
                <div class="flex flex-col gap-3 mt-4">
                    <a href="https://docs.google.com/spreadsheets/d/15CtlzSn56c1oTL_FhayaumWPb6ZVXlE4b7GZ040_QH0/edit?gid=0#gid=0" target="_blank" class="w-full bg-orange-50 hover:bg-orange-600 hover:text-white text-orange-700 font-semibold py-3 px-4 rounded-xl transition duration-300 flex items-center justify-between group">
                        <span>Spreadsheet Utama</span>
                        <i class="fa-solid fa-table group-hover:translate-x-1 transition-transform"></i>
                    </a>
                    <a href="https://docs.google.com/spreadsheets/d/1jZGl8WzxS5y3U2HVSUKVj8Bos-C8laZCRlQbXtvoY0Y/edit?gid=175322993#gid=175322993" target="_blank" class="w-full bg-orange-50 hover:bg-orange-600 hover:text-white text-orange-700 font-semibold py-3 px-4 rounded-xl transition duration-300 flex items-center justify-between group">
                        <span>Spreadsheet Jepang</span>
                        <i class="fa-solid fa-file-csv group-hover:translate-x-1 transition-transform"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function openModal(modalID) {
            const modal = document.getElementById(modalID);
            const container = modal.querySelector('.modal-container');
            
            modal.classList.remove('opacity-0', 'pointer-events-none');
            document.body.classList.add('modal-active');
            
            // Animasi masuk (Scale up)
            setTimeout(() => {
                container.classList.remove('scale-95');
                container.classList.add('scale-100');
            }, 10);
        }

        function closeModal(modalID) {
            const modal = document.getElementById(modalID);
            const container = modal.querySelector('.modal-container');

            // Animasi keluar (Scale down)
            container.classList.remove('scale-100');
            container.classList.add('scale-95');

            setTimeout(() => {
                modal.classList.add('opacity-0', 'pointer-events-none');
                document.body.classList.remove('modal-active');
            }, 300);
        }

        // Menutup modal dengan tombol ESC
        document.onkeydown = function(evt) {
            evt = evt || window.event;
            if (evt.keyCode == 27) {
                const modals = document.querySelectorAll('.modal');
                modals.forEach(modal => {
                    if(!modal.classList.contains('opacity-0')) {
                        const id = modal.getAttribute('id');
                        closeModal(id);
                    }
                });
            }
        };
    </script>
</body>
</html>
